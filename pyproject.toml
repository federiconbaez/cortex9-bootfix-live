[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bootfix-live"
version = "0.1.0"
description = "Diagnóstico solo-lectura de arranque GRUB/UEFI/BIOS desde un live USB, con plan de reparación explicado"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bootfix = "bootfix.cli:main"

[tool.setuptools]
packages = ["bootfix"]
